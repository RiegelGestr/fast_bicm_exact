[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "new-bicm"
version = "0.1.0"
description = "Exact BiCM projection: degree-class Newton, grouped Poisson-binomial p-values, low RAM."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "numba",
    "statsmodels",
    "bicm",
    "threadpoolctl",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["new_bicm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
